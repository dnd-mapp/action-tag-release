minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  lefthook: true
sideEffectsCache: false

# Other Settings
catalogMode: "strict"
savePrefix: "~"

catalog:
  "@dnd-mapp/changelog-tools": ~1.1.1
  "@types/node": ~24.19.1
  typescript: ~6.0.3
catalogs:
  commitlint:
    "@commitlint/cli": ~21.2.3
    "@dnd-mapp/config-commitlint": ~1.1.0
    lefthook: ~2.1.16
  markdown:
    "@dnd-mapp/config-markdown": ~1.0.0
    markdownlint-cli2: ~0.23.3
  prettier:
    "@dnd-mapp/config-prettier": ~1.1.0
    prettier: ~3.9.9
    prettier-plugin-organize-imports: ~4.3.0
