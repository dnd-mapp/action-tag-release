name: CI checks
description: Installs dependencies, checks formatting, and lints Markdown and workflows

runs:
    using: composite
    steps:
        - name: Set up Node.js and pnpm and install dependencies
          uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
          with:
              cache: true
              runtime: node
              require-lockfile: true

        - name: Check formatting
          shell: bash
          run: pnpm run format-check

        - name: Lint Markdown
          shell: bash
          run: pnpm run lint-md

        - name: Lint workflows
          uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
          with:
              version: 1.7.12
              pyflakes: false
